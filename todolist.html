<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  
  <style>
    /* --- CSS STYLES --- */
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .todo-container {
      background: white;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 350px;
    }

    h2 {
      text-align: center;
      margin-top: 0;
      color: #333;
    }

    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button#addBtn {
      padding: 10px 15px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button#addBtn:hover {
      background-color: #218838;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f9f9f9;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    li:hover {
      background: #eee;
    }

    .completed {
      text-decoration: line-through;
      color: #888;
    }

    .delete-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>

  <!-- --- HTML STRUCTURE --- -->
  <div class="todo-container">
    <h2>To-Do List</h2>
    
    <div class="input-section">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button id="addBtn">Add</button>
    </div>

    <ul id="taskList">
      <!-- Tasks appear here -->
    </ul>
  </div>

  <script>
    // --- JAVASCRIPT LOGIC ---
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');

    // Listen for button click or Enter key
    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addTask();
      }
    });

    function addTask() {
      const taskText = taskInput.value.trim();

      if (taskText === '') {
        alert('Please enter a task!');
        return;
      }

      // Create new list item
      const li = document.createElement('li');
      li.innerText = taskText;

      // Toggle completion status when clicked
      li.addEventListener('click', function() {
        li.classList.toggle('completed');
      });

      // Create Delete button
      const deleteBtn = document.createElement('button');
      deleteBtn.innerText = 'Delete';
      deleteBtn.classList.add('delete-btn');
      
      // Remove item when delete is clicked
      deleteBtn.addEventListener('click', function(e) {
        e.stopPropagation(); // Prevents marking as completed when clicking delete
        li.remove();
      });

      // Assemble the item and add it to the list
      li.appendChild(deleteBtn);
      taskList.appendChild(li);

      // Clear the input
      taskInput.value = '';
    }
  </script>
</body>
</html>
